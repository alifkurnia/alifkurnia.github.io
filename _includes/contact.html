<!-- Contact -->
<section class="page-section" id="{{ site.data.sitetext[site.locale].contact.section | default: "contact" }}">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2 class="section-heading text-uppercase">
          {{ site.data.sitetext[site.locale].contact.title | markdownify | default: Contact Us }}</h2>
        <h3 class="section-subheading text-muted">{{ site.data.sitetext[site.locale].contact.text | default: "" }}</h3>
      </div>
    </div>
    <div class="row justify-content-center text-center">
      <div class="col-md-4">
        <a class="btn btn-primary btn-xl text-uppercase" href="mailto:{{ site.email }}">Email Saya</a>
      </div>
      <div class="col-md-4">
        <a class="btn btn-primary btn-xl text-uppercase" href="https://www.linkedin.com/in/alif-muhammad-yardan-kurnia/" target="_blank" rel="noopener">LinkedIn</a>
      </div>
    </div>
  </div>
</section>
<!-- End Contact -->
